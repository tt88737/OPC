name: Container Delivery

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPC_DB_PASSWORD: container-ci-database-password
      OPC_MYSQL_ROOT_PASSWORD: container-ci-root-password
      OPC_REDIS_PASSWORD: container-ci-redis-password
      OPC_TOKEN_SECRET: container-ci-token-secret-that-is-at-least-sixty-four-characters-long
      OPC_BOOTSTRAP_ADMIN_PASSWORD: container-ci-admin-password
      OPC_HTTP_PORT: 8088
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build container images
        run: docker compose build --pull

      - name: Start stack
        run: docker compose up --detach --wait --wait-timeout 240

      - name: Smoke test frontend and API proxy
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://127.0.0.1:8088/healthz
          curl --fail --silent --show-error http://127.0.0.1:8088/prod-api/actuator/health
          curl --fail --silent --show-error http://127.0.0.1:8088/prod-api/captchaImage > /dev/null

      - name: Capture container diagnostics
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down --volumes --remove-orphans
