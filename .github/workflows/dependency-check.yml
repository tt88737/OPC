name: Dependency Check

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  scan:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Provision ripgrep
        shell: powershell
        run: |
          choco install ripgrep --yes --no-progress
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          rg --version

      - name: Set up Java 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Scan Maven dependencies
        id: maven_scan
        continue-on-error: true
        shell: powershell
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          & mvn -Pdependency-check dependency-check:aggregate
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $reportPath = 'target/dependency-check-report.json'
          if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) {
            throw "Dependency Check did not create $reportPath."
          }
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          if (-not $report.dependencies -or $report.dependencies.Count -eq 0) {
            throw 'Dependency Check reported zero dependencies.'
          }

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Upload Dependency Check reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-check-reports
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
          if-no-files-found: warn

      - name: Fail when Maven dependency scan failed
        if: always() && steps.maven_scan.outcome != 'success'
        shell: powershell
        run: exit 1
