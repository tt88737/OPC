spring:
  devtools:
    restart:
      enabled: false
  data:
    redis:
      password: ${OPC_REDIS_PASSWORD}
  datasource:
    druid:
      webStatFilter:
        enabled: false
      statViewServlet:
        enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

cors:
  allowed-origins: ${OPC_CORS_ALLOWED_ORIGINS}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
